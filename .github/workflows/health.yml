name: Health Check Sources

# 源健康检查：只改 enabled 状态，不产出订阅。
# 每小时跑一次 —— 20 个源 × 一次请求，成本可以忽略，
# 但能比"每天更新"早很多发现死源。
"on":
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    concurrency:
      # 和 update.yml 共用一把锁，避免两个工作流同时写 config/sources.json
      group: tvbox-config-write
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check every source
        run: python scripts/health.py

      - name: Commit health results
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json config/health.json
          if git diff --cached --quiet; then
            echo "::notice::源状态无变化"
          else
            git commit -m "chore(health): 源健康检查 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin main
            echo "::notice::已更新源状态"
          fi
